    <script>
      (function () {
        var o = typeof location !== "undefined" && location.protocol && location.protocol !== "file:" ? location.origin : "";
        if (!o) return;
        var path = location.pathname || "/";
        if (path.length > 1 && path.charAt(path.length - 1) === "/") path = path.slice(0, -1);
        var pageUrl = o + (path === "" ? "/" : path);
        var homeUrl = o + "/";
        function a(sel, attr, v) {
          var e = document.querySelector(sel);
          if (e) e.setAttribute(attr, v);
        }
        a('link[rel="canonical"]', "href", pageUrl);
        a('meta[property="og:url"]', "content", pageUrl);
        a('meta[property="og:image"]', "content", o + "/og-image.png");
        a('meta[property="og:image:secure_url"]', "content", o + "/og-image.png");
        a('meta[name="twitter:image"]', "content", o + "/og-image.png");
        document.querySelectorAll('script[type="application/ld+json"]').forEach(function (s) {
          try {
            s.textContent = s.textContent.split("__OG_SITE_BASE__").join(o);
            var j = JSON.parse(s.textContent);
            if (j["@graph"]) {
              j["@graph"].forEach(function (node) {
                if (node["@id"]) node["@id"] = node["@id"].replace(homeUrl + "#", o + "/#");
                if (node.url === homeUrl || node.url === o + "/") node.url = homeUrl;
                if (node.logo && node.logo.url) node.logo.url = o + "/nexora-logo.png";
                if (node.publisher && node.publisher["@id"]) node.publisher["@id"] = o + "/#organization";
              });
              s.textContent = JSON.stringify(j);
            }
          } catch (e) {}
        });
      })();
    </script>
